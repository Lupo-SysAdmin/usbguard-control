[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usbguard-control"
version = "0.2.0"
description = "An independent, modern Linux desktop client for USBGuard"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
authors = [{name = "Jan Herrera"}]
dependencies = ["PySide6>=6.6,<7"]
classifiers = ["Development Status :: 5 - Production/Stable", "Operating System :: POSIX :: Linux", "Topic :: Security"]

[project.urls]
Author = "https://github.com/Lupo-SysAdmin"
Repository = "https://github.com/Lupo-SysAdmin/usbguard-control"
Issues = "https://github.com/Lupo-SysAdmin/usbguard-control/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
usbguard-control = "usbguard_control.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usbguard_control = ["qml/*.qml", "assets/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
