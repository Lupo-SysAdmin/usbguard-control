name: Linux validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-gi python3-pytest python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtqml python3-pyside6.qtquick python3-pyside6.qtquickcontrols2 qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtqml-workerscript dbus-daemon desktop-file-utils fonts-dejavu-core
      - name: Test and package without USB hardware
        run: sh scripts/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: usbguard-control-linux
          path: |
            dist/*.deb
            docs/images/usbguard-control-demo.png
